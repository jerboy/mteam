<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>M-Team 资源助手</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="downloaders.css">
  <link rel="stylesheet" href="tasks.css">
  <link rel="stylesheet" href="content.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="search-page">
  <div class="workspace">
    <header class="topbar">
      <div class="brand"><img src="icons/48.png" width="36" height="36" alt=""><div><h1>M-Team<span>资源助手</span></h1></div></div>
      <nav class="header-actions" aria-label="工具">
        <span id="connection" class="connection">未配置</span>
        <button id="open-tasks" class="icon-button" data-icon="tasks" title="下载任务" aria-label="下载任务">任务</button>
        <button id="dashboard" class="icon-button" data-icon="expand" title="在新标签页打开" aria-label="在新标签页打开"></button>
        <button id="settings" class="icon-button" data-icon="settings" title="设置" aria-label="设置"></button>
      </nav>
    </header>
    <main>
      <section class="search-panel" aria-label="搜索资源">
        <form id="search-form">
          <div class="search-input-row">
            <label class="search-input-wrap"><svg class="search-symbol" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><span class="sr-only">搜索关键词</span><input id="keyword" type="search" maxlength="100" placeholder="搜索资源" autocomplete="off" autofocus></label>
            <button id="search-button" class="button primary" type="submit">搜索</button>
          </div>
        </form>
      </section>
      <div id="notice" class="notice" role="status" hidden></div>
      <section class="results-section" aria-labelledby="results-title">
        <div class="results-toolbar">
          <h2 id="results-title">资源 <span id="result-count"></span></h2>
          <div class="result-controls">
            <select id="sort" form="search-form" aria-label="排序方式" title="排序方式"><option value="CREATED_DATE">发布时间</option><option value="SEEDERS">做种人数</option><option value="SIZE">文件大小</option><option value="TIMES_COMPLETED">完成次数</option><option value="LEECHERS">下载人数</option><option value="NAME">资源名称</option></select>
            <button id="direction" type="button" class="icon-button" data-icon="arrow-down" data-direction="desc" title="切换为升序" aria-label="切换排序方向：当前降序"></button>
            <button id="filters-toggle" type="button" class="filter-toggle" aria-expanded="false" aria-controls="filter-panel"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 5h12M2 11h12"/><path d="M5 3v4M11 9v4"/></svg>筛选<span id="filter-count" class="filter-count" hidden></span></button>
            <button id="refresh-results" class="icon-button" data-icon="refresh" title="刷新结果" aria-label="刷新结果" disabled></button>
          </div>
          <div id="filter-panel" class="filter-panel" role="group" aria-label="筛选条件" hidden>
            <div class="filters">
              <label>分区<select id="mode" form="search-form"><option value="normal">综合区</option><option value="movie">电影</option><option value="tvshow">剧集</option><option value="anime">动漫</option><option value="music">音乐</option><option value="all">全部分区</option><option value="adult">成人区</option></select></label>
              <label>分类<select id="category" form="search-form"><option value="">全部分类</option></select></label>
              <label>促销<select id="discount" form="search-form"><option value="">全部促销</option><option value="FREE">Free · 免费</option><option value="_2X_FREE">2× Free</option><option value="PERCENT_50">50% 下载</option><option value="PERCENT_70">30% 下载</option><option value="_2X">2× 上传</option><option value="_2X_PERCENT_50">2× / 50%</option><option value="NORMAL">普通资源</option></select></label>
            </div>
            <div class="filter-preferences"><label class="checkbox"><input id="only-fav" type="checkbox" form="search-form">只看收藏</label><label class="refresh-preference">自动刷新<select id="auto-refresh"><option value="0">关闭</option><option value="300000">每 5 分钟</option><option value="900000">每 15 分钟</option><option value="1800000">每 30 分钟</option></select></label></div>
            <div class="filter-actions"><button id="clear-filters" class="text-button" type="button">重置</button><button id="apply-filters" class="button primary" type="submit" form="search-form">应用</button></div>
          </div>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
      </section>
    </main>
    <footer class="pagination"><span id="page-info">尚未搜索</span><div><button id="previous" class="button subtle" data-icon="chevron-left" disabled>上一页</button><button id="next" class="button subtle" data-icon="chevron-right" disabled>下一页</button></div></footer>
  </div>
  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="dialog-header"><span class="detail-label">资源详情</span><button class="icon-button" id="close-detail" data-icon="close" aria-label="关闭详情"></button></div>
    <h2 id="detail-title">资源详情</h2><p id="detail-subtitle" class="muted"></p><div id="detail-meta" class="detail-meta"></div>
    <div class="detail-label">资源简介</div><div id="detail-description" class="markdown-body"></div>
    <p id="detail-status" class="dialog-status" role="status" hidden></p><div class="dialog-actions"><button id="detail-open" class="text-button" data-icon="expand">打开站点</button><button id="detail-copy" class="button secondary">复制链接</button><button id="detail-download" class="button primary">下载</button></div>
  </dialog>
  <dialog id="link-dialog" aria-labelledby="link-title"><div class="dialog-header"><h2 id="link-title">下载链接</h2><button id="close-link" class="icon-button" data-icon="close" aria-label="关闭链接"></button></div><label class="sr-only" for="download-link">下载链接</label><textarea id="download-link" readonly rows="4" spellcheck="false"></textarea><p id="link-status" class="dialog-status" role="status" hidden></p><div class="dialog-actions"><button id="copy-again" class="button primary">复制链接</button></div></dialog>
  <dialog id="image-dialog" aria-label="图片预览">
    <div class="image-toolbar">
      <span id="image-count" role="status" hidden></span>
      <button id="image-zoom" class="text-button" title="还原缩放（0）" aria-label="还原图片缩放" hidden>100%</button>
      <button id="close-image" class="icon-button" data-icon="close" aria-label="关闭图片预览" autofocus></button>
    </div>
    <div id="image-stage" title="滚轮缩放 · 拖动查看 · 双击还原"></div>
    <button id="image-previous" class="icon-button image-nav" data-icon="chevron-left" title="上一张（←）" aria-label="上一张图片" hidden></button>
    <button id="image-next" class="icon-button image-nav" data-icon="chevron-right" title="下一张（→）" aria-label="下一张图片" hidden></button>
    <p id="image-status" role="status" hidden></p>
  </dialog>
  <dialog id="send-dialog" aria-labelledby="send-title">
    <div class="dialog-header"><h2 id="send-title">下载</h2><button id="close-send" class="icon-button" data-icon="close" aria-label="关闭下载"></button></div>
    <p id="send-resource" class="send-resource"></p>
    <form id="send-form">
      <div id="send-empty" class="send-empty" hidden><span>添加你的 qBittorrent</span><button id="setup-downloader" class="button secondary" data-icon="plus" type="button">添加</button></div>
      <div id="send-fields">
        <label class="send-field">下载器<select id="send-downloader" required></select></label>
        <div id="send-custom-field" class="send-field">
          <div class="send-path-heading"><label for="send-custom-path">下载目录</label><select id="send-location" aria-label="目录来源" disabled hidden></select></div>
          <input id="send-custom-path" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="send-path-suggestions" maxlength="1024" placeholder="输入路径 · Tab 补全" spellcheck="false" autocomplete="off" required disabled>
          <div id="send-path-menu" class="path-menu" hidden>
            <div id="send-path-suggestions" role="listbox" aria-label="匹配目录"></div>
            <div id="send-path-feedback" class="path-status" hidden><span id="send-path-status" role="status"></span><button id="send-path-retry" class="path-retry" type="button" hidden>重试</button></div>
          </div>
        </div>
        <p id="send-path-preview" class="send-path-preview" hidden></p>
      </div>
      <div id="send-status" class="notice" role="status" hidden></div>
      <div class="send-actions"><button id="save-torrent-file" class="text-button" type="button">保存种子文件</button><button id="send-submit" class="button primary" type="submit" disabled>开始下载</button></div>
    </form>
  </dialog>
  <dialog id="tasks-dialog" aria-labelledby="tasks-title">
    <div class="dialog-header"><h2 id="tasks-title">下载任务</h2><button id="close-tasks" class="icon-button" data-icon="close" aria-label="关闭任务中心"></button></div>
    <div class="tasks-toolbar">
      <select id="tasks-downloader" aria-label="下载器"></select>
      <select id="tasks-filter" aria-label="任务状态"><option value="all">全部任务</option><option value="downloading">下载中</option><option value="completed">已完成</option></select>
      <button id="tasks-refresh" class="icon-button" data-icon="refresh" title="刷新任务" aria-label="刷新任务"></button>
    </div>
    <div id="tasks-list" aria-label="下载任务列表"></div>
    <div id="tasks-status" class="notice" role="status" hidden></div>
    <button id="tasks-setup" class="text-button" data-icon="plus" hidden>添加下载器</button>
    <div class="tasks-footer"><span id="tasks-page"></span><div><button id="tasks-previous" class="icon-button" data-icon="chevron-left" aria-label="上一页任务"></button><button id="tasks-next" class="icon-button" data-icon="chevron-right" aria-label="下一页任务"></button></div></div>
  </dialog>
  <dialog id="task-delete-dialog" aria-labelledby="task-delete-title">
    <div class="dialog-header"><h2 id="task-delete-title">删除任务</h2><button id="close-task-delete" class="icon-button" data-icon="close" aria-label="取消删除"></button></div>
    <p id="task-delete-name"></p><p id="task-delete-path"></p>
    <p class="delete-consequence">同时删除下载器上的文件，无法撤销。</p>
    <div id="task-delete-status" class="notice" role="status" hidden></div>
    <div class="dialog-actions"><button id="task-delete-cancel" class="button subtle" autofocus>取消</button><button id="task-delete-confirm" class="button delete-button">删除任务及文件</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
