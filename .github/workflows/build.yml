name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Unit tests and extension package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install unit test dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Check authentication rules against Chromium RE2 limits
        run: |
          python3 -m venv "$RUNNER_TEMP/re2-tests"
          "$RUNNER_TEMP/re2-tests/bin/python" -m pip install --only-binary=:all: -r scripts/tests/requirements.txt
          "$RUNNER_TEMP/re2-tests/bin/python" -m unittest discover -s scripts/tests -p '*_test.py'
      - name: Build extension ZIP and checksum
        id: package
        run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mteam-extension-${{ steps.package.outputs.version }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

  launcher:
    name: macOS launcher unit tests and universal package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run launcher unit tests
        run: npm run test:launcher
      - name: Compile and package launcher
        id: package
        run: npm run package:launcher
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mteam-launcher-macos-${{ steps.package.outputs.version }}
          path: |
            release/mteam-launcher-macos-*.zip
            release/mteam-launcher-macos-*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mteam-extension-${{ needs.build.outputs.version }}
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mteam-launcher-macos-${{ needs.build.outputs.version }}
          path: release
      - name: Verify package checksum
        working-directory: release
        run: sha256sum --check ./*.sha256
      - name: Publish extension and launcher packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Chrome / Edge 浏览器扩展安装包。

          1. 下载下方的 `mteam-extension-*.zip` 并解压。
          2. 打开 `chrome://extensions` 或 `edge://extensions`，开启开发者模式。
          3. 点击「加载已解压的扩展程序」，选择解压后的 `mteam-extension` 文件夹。

          更新时将文件覆盖到原安装目录，再点击「重新加载」，保留原扩展 ID 和设置。
          `.sha256` 文件用于校验 ZIP。无需启动服务器。

          macOS 独立入口：另下载 `mteam-launcher-macos-*.zip`，将其中的应用放入「应用程序」。首次打开选择浏览器和个人资料，扩展 ID 每次启动自动识别，换目录重新加载后自动更新；按住 Option 再打开可修改。macOS 限制读取时，通过系统文件选择框允许访问。需先安装或更新扩展至本版本。支持 macOS 13+ 的 Apple Silicon 与 Intel。
          启动器尚未经过 Apple 公证；如 macOS 阻止打开，请到「系统设置 → 隐私与安全性」确认打开。窗口仍由 Chrome / Edge 管理。
          NOTES
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 \
            --verify-tag --title "M-Team 资源助手 $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
